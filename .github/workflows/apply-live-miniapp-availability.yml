name: Apply Live Mini App Availability

on:
  push:
    branches:
      - fix/live-miniapp-availability
    paths:
      - '.patches/live_miniapp_availability.py'
      - '.patches/session_retry_fix.py'
      - '.patches/admin_dashboard_accuracy.py'
      - '.patches/admin_dashboard_tidy.py'
      - '.patches/receipt_confirmation_accuracy.py'
      - '.github/workflows/apply-live-miniapp-availability.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-miniapp-availability-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-miniapp-availability
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/backend/package.json

      - name: Apply patches
        run: |
          python3 .patches/live_miniapp_availability.py
          python3 .patches/session_retry_fix.py
          python3 .patches/admin_dashboard_accuracy.py
          python3 .patches/admin_dashboard_tidy.py
          python3 .patches/receipt_confirmation_accuracy.py

      - name: Install backend dependencies
        working-directory: bot/backend
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check app.js
          node --check bot/backend/src/index.js
          node --check bot/backend/src/db.js
          node --check bot/backend/tests/liveMiniAppAvailability.test.js
          node --check bot/backend/tests/sessionRetry.test.js
          node --check bot/backend/tests/adminStatsAccuracy.test.js
          node --check bot/backend/tests/navigationRecoveryCore.test.js
          node --check bot/backend/tests/sellerCashAccounting.test.js

      - name: Full regression suite
        working-directory: bot/backend
        run: npm test

      - name: Verify live-availability and admin-stat invariants
        run: |
          grep -F "const BOT_BUILD = '1.3.9';" bot/backend/src/index.js
          grep -F '"version": "1.3.9"' bot/backend/package.json
          grep -F "sendFreshMiniAppLauncher" bot/backend/src/index.js
          grep -F "createWebSession(telegramId, null, 5)" bot/backend/src/index.js
          grep -F "createWebSession(seller.telegram_id, seller.id, 5)" bot/backend/src/index.js
          grep -F "url.searchParams.set('at', String(Date.now()))" bot/backend/src/index.js
          grep -F "if (unavailable[state.activePool].has(number)) continue;" app.js
          grep -F "SNAPSHOT_MAX_AGE_MS = 5 * 60_000" app.js
          grep -F "app.js?v=20261005-live-availability" index.html
          grep -F "peekWebSession(token, telegramId)" bot/backend/src/db.js
          grep -F "const session = db.peekWebSession(payload.session, telegramId);" bot/backend/src/index.js
          grep -F "statisticsOk" bot/backend/src/db.js
          grep -F "soldNumberCount" bot/backend/src/db.js
          grep -F "admin_more" bot/backend/src/index.js
          grep -F "Confirmed received" bot/backend/src/index.js
          grep -F "Sold purchase value" bot/backend/src/index.js
          grep -F "const receiptConfirmed = receiptVerified === true;" bot/backend/src/db.js
          grep -F "receiptMethod: 'admin_payment_confirmation'" bot/backend/src/index.js
          if grep -F "rows.push([{ text: buyText, web_app:" bot/backend/src/index.js; then exit 1; fi
          if grep -F 'dot taken' index.html; then exit 1; fi

      - name: Commit validated source and remove staging files
        run: |
          rm -f .patches/live_miniapp_availability.py .patches/session_retry_fix.py .patches/admin_dashboard_accuracy.py .patches/admin_dashboard_tidy.py .patches/receipt_confirmation_accuracy.py .patches/vercel_validate.sh .github/workflows/apply-live-miniapp-availability.yml vercel.json
          rmdir .patches 2>/dev/null || true
          git config user.name "Cachilupi"
          git config user.email "nebiyuelyas3@gmail.com"
          git add -A
          git commit -m "fix: live inventory and trustworthy admin statistics"
          git push origin HEAD:fix/live-miniapp-availability
