name: Force 100 ETB Amharic prize wording

on:
  push:
    paths:
      - '.github/workflows/update-100-etb-prize-wording.yml'

permissions:
  contents: write

jobs:
  update-wording:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Force runtime wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bot/backend/src/index.js')
          text = path.read_text(encoding='utf-8')
          old = "function prizeSetting(pool, lang) { return db.getSetting(`prize_${pool}_${lang === 'en' ? 'en' : 'am'}`) || ''; }"
          new = """function prizeSetting(pool, lang) {
  const language = lang === 'en' ? 'en' : 'am';
  if (Number(pool) === 100 && language === 'am') return 'በእንጨት የተደጎሰ መጽሐፍ ቅዱስ';
  return db.getSetting(`prize_${pool}_${language}`) || '';
}"""
          if old not in text:
              if new not in text:
                  raise SystemExit('prizeSetting function was not found in expected form')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check bot/backend/src/index.js

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/backend/src/index.js
          git rm .github/workflows/update-100-etb-prize-wording.yml
          git commit -m "fix: force 100 ETB Amharic prize wording"
          git push origin HEAD:main
