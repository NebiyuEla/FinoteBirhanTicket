name: Apply Revenue And Timeout Correction

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-revenue-timeout.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply correction
        run: python3 .patches/revenue-timeout.py

      - name: Install dependencies
        working-directory: bot/backend
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Syntax checks
        working-directory: bot/backend
        run: |
          node --check src/config.js
          node --check src/db.js
          node --check src/index.js

      - name: Full regression suite
        working-directory: bot/backend
        run: npm test

      - name: Commit verified correction and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/revenue-timeout.py .github/workflows/apply-revenue-timeout.yml
          git add bot/backend/.env.example bot/backend/src/config.js bot/backend/src/db.js bot/backend/src/index.js bot/backend/tests/sellerCashAccounting.test.js
          git commit -m "fix: align revenue with sold tickets and extend reservations"
          git push origin HEAD:main
