name: Test and Build DISCloud Upload Package

on:
  push:
    branches:
      - main
    paths:
      - 'bot/backend/**'
      - '.github/workflows/build-discloud-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot/backend
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/backend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check production entrypoints
        run: |
          node --check src/start.js
          node --check src/runtimeGuards.js
          node --check src/index.js
          node --check src/db.js
          node --check src/telegram.js
          node --check src/verifyEt.js
          node --check src/ticketImage.js
          node --check src/utils.js

      - name: Run full test suite
        run: npm test

      - name: Verify required wording
        run: grep -F "በእንጨት የተደጎሰ መጽሐፍ ቅዱስ" src/index.js

      - name: Stage DISCloud upload files
        working-directory: .
        run: |
          rm -rf discloud-upload
          mkdir -p discloud-upload/src
          cp bot/backend/package.json discloud-upload/
          if [ -f bot/backend/package-lock.json ]; then cp bot/backend/package-lock.json discloud-upload/; fi
          cp bot/backend/discloud.config discloud-upload/
          cp bot/backend/.discloudignore discloud-upload/
          cp bot/backend/src/*.js discloud-upload/src/
          printf '%s\n' "Source commit: $(git rev-parse HEAD)" > discloud-upload/DEPLOYMENT_COMMIT.txt

      - name: Upload ready-to-use ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinoteBirhan-DISCloud
          path: discloud-upload/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
