name: Apply Seller Accounting Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-seller-accounting-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply staged patch
        run: python3 .patches/apply-seller-accounting.py

      - name: Install dependencies
        working-directory: bot/backend
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Syntax checks
        working-directory: bot/backend
        run: |
          node --check src/index.js
          node --check src/db.js
          node --check tests/sellerCashAccounting.test.js

      - name: Full regression suite
        working-directory: bot/backend
        run: npm test

      - name: Commit verified fix and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/apply-seller-accounting.py .github/workflows/apply-seller-accounting-fix.yml
          git add bot/backend/src/index.js bot/backend/src/db.js bot/backend/tests/sellerCashAccounting.test.js
          git commit -m "fix: separate seller cash from platform revenue"
          git push origin HEAD:main
