name: Apply Seller Cash Accounting Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-seller-accounting-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply seller accounting patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          db_path = Path('bot/backend/src/db.js')
          db = db_path.read_text()

          old = """    const paid = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid'`).get();
    const direct = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid' AND source='direct'`).get();
    const seller = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid' AND source='seller'`).get();
    const pending = this.db.prepare(`SELECT COUNT(*) AS c FROM purchases WHERE status IN ('verification_pending','seller_review','manual_review')`).get().c;
"""
          new = """    const paid = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid'`).get();
    const direct = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid' AND source='direct'`).get();
    const platform = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue
      FROM purchases WHERE status='paid' AND COALESCE(payment_target,'finote')='finote'`).get();
    const seller = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue FROM purchases WHERE status='paid' AND source='seller'`).get();
    const sellerCash = this.db.prepare(`SELECT COUNT(*) AS c, COALESCE(SUM(amount_etb),0) AS revenue
      FROM purchases WHERE status='paid' AND source='seller' AND payment_target='seller'`).get();
    const sellerCashPackages = this.db.prepare(`SELECT package_type, COUNT(*) AS sales, COALESCE(SUM(amount_etb),0) AS amount
      FROM purchases WHERE status='paid' AND source='seller' AND payment_target='seller'
      GROUP BY package_type`).all();
    const pending = this.db.prepare(`SELECT COUNT(*) AS c FROM purchases WHERE status IN ('verification_pending','seller_review','manual_review')`).get().c;
"""
          assert old in db, 'dashboard query block not found'
          db = db.replace(old, new, 1)

          old = """    return { users, paidCount: paid.c, revenue: paid.revenue, directCount: direct.c, directRevenue: direct.revenue, sellerCount: seller.c, sellerRevenue: seller.revenue, pending, sellers, pools };
"""
          new = """    return {
      users,
      paidCount: paid.c,
      grossSalesValue: paid.revenue,
      revenue: platform.revenue,
      platformPaidCount: platform.c,
      directCount: direct.c,
      directRevenue: direct.revenue,
      sellerCount: seller.c,
      sellerRevenue: seller.revenue,
      sellerCashCount: sellerCash.c,
      sellerCashRevenue: sellerCash.revenue,
      sellerCashPackages,
      pending,
      sellers,
      pools
    };
"""
          assert old in db, 'dashboard return block not found'
          db = db.replace(old, new, 1)

          old = """    const customers = this.db.prepare(`SELECT COUNT(DISTINCT buyer_phone) AS c FROM purchases WHERE seller_id=? AND status='paid'`).get(sellerId).c;
    return { seller, paidCount: paid.c, revenue: paid.revenue, pending, tickets, customers };
"""
          new = """    const customers = this.db.prepare(`SELECT COUNT(DISTINCT buyer_phone) AS c FROM purchases WHERE seller_id=? AND status='paid'`).get(sellerId).c;
    const sellerCash = this.db.prepare(`SELECT COUNT(*) AS c,COALESCE(SUM(amount_etb),0) AS revenue
      FROM purchases WHERE seller_id=? AND status='paid' AND payment_target='seller'`).get(sellerId);
    const finotePaid = this.db.prepare(`SELECT COUNT(*) AS c,COALESCE(SUM(amount_etb),0) AS revenue
      FROM purchases WHERE seller_id=? AND status='paid' AND COALESCE(payment_target,'finote')='finote'`).get(sellerId);
    const packages = this.db.prepare(`SELECT package_type, COUNT(*) AS sales, COALESCE(SUM(amount_etb),0) AS amount
      FROM purchases WHERE seller_id=? AND status='paid'
      GROUP BY package_type`).all(sellerId);
    return {
      seller,
      paidCount: paid.c,
      salesValue: paid.revenue,
      revenue: paid.revenue,
      sellerCashCount: sellerCash.c,
      sellerCashRevenue: sellerCash.revenue,
      finotePaidCount: finotePaid.c,
      finotePaidRevenue: finotePaid.revenue,
      packages,
      pending,
      tickets,
      customers
    };
"""
          assert old in db, 'sellerStats block not found'
          db = db.replace(old, new, 1)
          db_path.write_text(db)

          index_path = Path('bot/backend/src/index.js')
          index = index_path.read_text()

          marker = """async function showSellerPanel(telegramId) {
"""
          helper = """function formatPackageBreakdown(rows, am = false) {
  const byType = new Map((rows || []).map((row) => [String(row.package_type), row]));
  const types = [['bundle', 'Bundle'], ['200', '200'], ['100', '100'], ['50', '50']];
  return types.map(([key, label]) => {
    const row = byType.get(key);
    const sales = Number(row?.sales || 0);
    const amount = Number(row?.amount || 0);
    return `${label}: ${sales} (${amount} ${am ? 'ብር' : 'ETB'})`;
  }).join(' · ');
}

async function showSellerPanel(telegramId) {
"""
          assert marker in index, 'showSellerPanel marker not found'
          index = index.replace(marker, helper, 1)

          old = """  const recent = db.recentSellerSales(seller.id, 6);
  const account = db.sellerHasPaymentAccount(seller.id)
"""
          new = """  const recent = db.recentSellerSales(seller.id, 6);
  const packageBreakdown = formatPackageBreakdown(stats.packages, am);
  const account = db.sellerHasPaymentAccount(seller.id)
"""
          assert old in index, 'seller panel setup block not found'
          index = index.replace(old, new, 1)

          old = """🎟 የወጡ ትኬቶች: ${stats.tickets}
💰 ጠቅላላ ሽያጭ: ${stats.revenue} ብር
⏳ በመጠባበቅ ላይ: ${stats.pending}
"""
          new = """🎟 የወጡ ትኬቶች: ${stats.tickets}
💵 በሻጭ/ጥሬ ገንዘብ የተሰበሰበ: ${stats.sellerCashRevenue} ብር (${stats.sellerCashCount})
🏦 ወደ ፍኖተ ብርሃን የተከፈለ: ${stats.finotePaidRevenue} ብር (${stats.finotePaidCount})
📦 ሽያጭ በጥቅል: ${packageBreakdown}
⏳ በመጠባበቅ ላይ: ${stats.pending}
"""
          assert old in index, 'Amharic seller totals not found'
          index = index.replace(old, new, 1)

          old = """Tickets issued: ${stats.tickets}
Collected: ${stats.revenue} ETB
Pending: ${stats.pending}
"""
          new = """Tickets issued: ${stats.tickets}
Seller/cash collected: ${stats.sellerCashRevenue} ETB (${stats.sellerCashCount})
Paid to FinoteBirhan: ${stats.finotePaidRevenue} ETB (${stats.finotePaidCount})
Sales by package: ${packageBreakdown}
Pending: ${stats.pending}
"""
          assert old in index, 'English seller totals not found'
          index = index.replace(old, new, 1)

          old = """  const s = db.dashboardStats();
  const recovery = db.recoveryStats();
  const poolLines = s.pools.map((p) => am ? `${p.pool} ብር: ${p.sold}/200 ተሽጧል · ${p.reserved} ተይዟል` : `${p.pool} ETB: ${p.sold}/200 sold · ${p.reserved} reserved`).join('\\n');
"""
          new = """  const s = db.dashboardStats();
  const recovery = db.recoveryStats();
  const sellerCashBreakdown = formatPackageBreakdown(s.sellerCashPackages, am);
  const poolLines = s.pools.map((p) => am ? `${p.pool} ብር: ${p.sold}/200 ተሽጧል · ${p.reserved} ተይዟል` : `${p.pool} ETB: ${p.sold}/200 sold · ${p.reserved} reserved`).join('\\n');
"""
          assert old in index, 'admin dashboard setup block not found'
          index = index.replace(old, new, 1)

          old = """ቀጥታ ሽያጭ: ${s.directRevenue} ብር (${s.directCount})
በሻጭ የተመዘገበ: ${s.sellerRevenue} ብር (${s.sellerCount})
"""
          new = """🏦 ፍኖተ ብርሃን የተቀበለው: ${s.revenue} ብር (${s.platformPaidCount})
💵 በሻጭ/ጥሬ ገንዘብ የተሰበሰበ: ${s.sellerCashRevenue} ብር (${s.sellerCashCount}) — በገቢ አይቆጠርም
📦 የሻጭ ጥሬ ገንዘብ ሽያጭ በጥቅል: ${sellerCashBreakdown}
"""
          assert old in index, 'Amharic admin seller accounting block not found'
          index = index.replace(old, new, 1)

          old = """Direct: ${s.directRevenue} ETB (${s.directCount})
Seller-entered sales: ${s.sellerRevenue} ETB (${s.sellerCount})
"""
          new = """Received by FinoteBirhan: ${s.revenue} ETB (${s.platformPaidCount})
Seller/cash collected: ${s.sellerCashRevenue} ETB (${s.sellerCashCount}) — excluded from Revenue
Seller cash sales by package: ${sellerCashBreakdown}
"""
          assert old in index, 'English admin seller accounting block not found'
          index = index.replace(old, new, 1)
          index_path.write_text(index)

          test_path = Path('bot/backend/tests/sellerCashAccounting.test.js')
          test_path.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import { TicketDatabase } from '../src/db.js';

function makeDb() {
  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'finote-seller-accounting-'));
  const db = new TicketDatabase(path.join(dir, 'test.sqlite'));
  db.ensureUser(1); db.setUserName(1, 'Buyer'); db.setUserPhone(1, '+251911111111');
  db.ensureUser(3); db.setUserName(3, 'Seller'); db.setUserPhone(3, '+251933333333');
  const seller = db.activateSellerRole(3, 999).seller;
  return { db, dir, seller };
}

function insertPaid(db, { id, packageType, amount, sellerId = null, source = 'direct', paymentTarget = 'finote' }) {
  const now = new Date().toISOString();
  db.db.prepare(`INSERT INTO purchases(
    id,buyer_telegram_id,buyer_name,buyer_phone,package_type,amount_etb,seller_id,source,status,
    reserved_until,created_at,paid_at,linked_telegram_id,payment_target
  ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?)`).run(
    id, 1, 'Buyer', '+251911111111', packageType, amount, sellerId, source, 'paid',
    now, now, now, 1, paymentTarget
  );
}

test('seller-collected cash is excluded from platform Revenue and counted by package', () => {
  const { db, dir, seller } = makeDb();
  try {
    insertPaid(db, { id: 'DIRECT-200', packageType: '200', amount: 200 });
    insertPaid(db, { id: 'SELLER-FINOTE-200', packageType: '200', amount: 200, sellerId: seller.id, source: 'seller', paymentTarget: 'finote' });
    insertPaid(db, { id: 'SELLER-CASH-BUNDLE', packageType: 'bundle', amount: 300, sellerId: seller.id, source: 'seller', paymentTarget: 'seller' });
    insertPaid(db, { id: 'SELLER-CASH-100-A', packageType: '100', amount: 100, sellerId: seller.id, source: 'seller', paymentTarget: 'seller' });
    insertPaid(db, { id: 'SELLER-CASH-100-B', packageType: '100', amount: 100, sellerId: seller.id, source: 'seller', paymentTarget: 'seller' });
    insertPaid(db, { id: 'SELLER-CASH-50', packageType: '50', amount: 50, sellerId: seller.id, source: 'seller', paymentTarget: 'seller' });

    const dashboard = db.dashboardStats();
    assert.equal(dashboard.grossSalesValue, 950);
    assert.equal(dashboard.revenue, 400);
    assert.equal(dashboard.platformPaidCount, 2);
    assert.equal(dashboard.sellerCashRevenue, 550);
    assert.equal(dashboard.sellerCashCount, 4);
    assert.deepEqual(
      dashboard.sellerCashPackages.map((row) => [row.package_type, row.sales, row.amount]).sort(),
      [['100', 2, 200], ['50', 1, 50], ['bundle', 1, 300]].sort()
    );

    const sellerStats = db.sellerStats(seller.id);
    assert.equal(sellerStats.paidCount, 5);
    assert.equal(sellerStats.salesValue, 750);
    assert.equal(sellerStats.sellerCashRevenue, 550);
    assert.equal(sellerStats.sellerCashCount, 4);
    assert.equal(sellerStats.finotePaidRevenue, 200);
    assert.equal(sellerStats.finotePaidCount, 1);
    assert.deepEqual(
      sellerStats.packages.map((row) => [row.package_type, row.sales, row.amount]).sort(),
      [['100', 2, 200], ['200', 1, 200], ['50', 1, 50], ['bundle', 1, 300]].sort()
    );
  } finally {
    db.close();
    fs.rmSync(dir, { recursive: true, force: true });
  }
});
""")
          PY

      - name: Install dependencies
        working-directory: bot/backend
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Syntax checks
        working-directory: bot/backend
        run: |
          node --check src/index.js
          node --check src/db.js
          node --check tests/sellerCashAccounting.test.js

      - name: Full regression suite
        working-directory: bot/backend
        run: npm test

      - name: Commit verified fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-seller-accounting-fix.yml
          git add bot/backend/src/index.js bot/backend/src/db.js bot/backend/tests/sellerCashAccounting.test.js
          git commit -m "fix: separate seller cash from platform revenue"
          git push origin HEAD:main
