name: Simplify Buyer Bot UX

on:
  push:
    paths:
      - '.github/workflows/simplify-buyer-bot.yml'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Simplify buyer-facing bot messages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('bot/backend/src/index.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ("'✝️ ወደ ፍኖተ ብርሃን ሰንበት ትምህርት ቤት ዲጂታል ዕጣ እንኳን ደህና መጡ።\\n\\nእባክዎ ሙሉ ስምዎን ይላኩ።'", "'✝️ ፍኖተ ብርሃን ዲጂታል ዕጣ\\n\\nሙሉ ስምዎን ይላኩ።'"),
            ("'✝️ Welcome to FinoteBirhan Sunday School Digital Tickets.\\n\\nPlease send your full name.'", "'✝️ FinoteBirhan Digital Tickets\\n\\nSend your full name.'"),
            ("am ? 'አሁን ስልክ ቁጥርዎን ይላኩ ወይም ከታች ያለውን ቁልፍ ይጫኑ።' : 'Now send your phone number or use the button below.'", "am ? '📱 ስልክ ቁጥርዎን ያጋሩ።' : '📱 Share your phone number.'"),
            ("${am ? 'ከታች አንዱን ይምረጡ።' : 'Choose an option below.'}", "${am ? '👇 ይምረጡ' : '👇 Choose'}"),
            ("{ placeholder: am ? 'አንዱን ይምረጡ' : 'Choose an option' }", "{ placeholder: am ? 'ይምረጡ' : 'Choose' }"),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected buyer copy not found: {old[:80]}')
            text = text.replace(old, new, 1)

          payment_pattern = re.compile(
            r"  db\.setUserState\(chatId, 'awaiting_payment', \{ purchaseId: purchase\.id \}\);\n"
            r"  await bot\.sendMessage\(chatId, am\n"
            r".*?"
            r"\n  \);\n}\n\nasync function handleStateMessage",
            re.S,
          )
          payment_lines = [
            "  db.setUserState(chatId, 'awaiting_payment', { purchaseId: purchase.id });",
            "  const safeProvider = htmlEscape(String(provider));",
            "  const safeAccountName = htmlEscape(String(accountName));",
            "  const safeAccountNumber = htmlEscape(String(accountNumber));",
            "  const safeNumbers = htmlEscape(String(numbers));",
            "  const safePackage = htmlEscape(String(packageLabel(purchase.package_type)));",
            "  const paymentText = am",
            "    ? `💳 <b>ክፍያ</b>\\n\\n🎟 <b>${safePackage}</b>\\n${safeNumbers}\\n⏱ ${config.reservationMinutes} ደቂቃ ተይዟል\\n\\n💰 <b>${purchase.amount_etb} ብር</b>\\n🏦 <b>ባንክ:</b> ${safeProvider}\\n👤 <b>ስም:</b> ${safeAccountName}\\n🔢 <b>አካውንት:</b> <code>${safeAccountNumber}</code>\\n\\nከከፈሉ በኋላ ደረሰኙን ወይም የግብይት ሊንኩን ይላኩ።`",
            "    : `💳 <b>Payment</b>\\n\\n🎟 <b>${safePackage}</b>\\n${safeNumbers}\\n⏱ Reserved for ${config.reservationMinutes} min\\n\\n💰 <b>${purchase.amount_etb} ETB</b>\\n🏦 <b>Bank:</b> ${safeProvider}\\n👤 <b>Name:</b> ${safeAccountName}\\n🔢 <b>Account:</b> <code>${safeAccountNumber}</code>\\n\\nAfter paying, send the receipt screenshot or transaction link/reference here.`;",
            "  await bot.sendMessage(chatId, paymentText, {",
            "    parse_mode: 'HTML',",
            "    reply_markup: inlineKeyboard([",
            "      [{ text: am ? '📋 አካውንት ቁጥር ቅዳ' : '📋 Copy account number', copy_text: { text: String(accountNumber) } }],",
            "      [{ text: am ? '❌ ሰርዝ' : '❌ Cancel', callback_data: `cancel_pay:${purchase.id}` }]",
            "    ])",
            "  });",
            "}",
            "",
            "async function handleStateMessage",
          ]
          payment_replacement = "\n".join(payment_lines)
          text, count = payment_pattern.subn(lambda m: payment_replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Payment block replacement count was {count}, expected 1')

          ticket_pattern = re.compile(
            r"    const caption = am\n"
            r"      \? `🎟 የፍኖተ ብርሃን ዲጂታል ትኬት\n.*?"
            r"\$\{dateLine\}`;\n"
            r"    await bot\.sendPhoto\(chatId, png, `\$\{ticket\.id\}\.png`, caption\);",
            re.S,
          )
          ticket_lines = [
            "    const safePrize = htmlEscape(String(prize));",
            "    const safeOwner = htmlEscape(String(ticket.owner_name || ''));",
            "    const safeDate = htmlEscape(String(dateLine));",
            "    const caption = am",
            "      ? `🎟 <b>${ticket.pool} ብር · #${formatNumber(ticket.number)}</b>\\n🏆 <b>ሽልማት:</b> ${safePrize}\\n👤 ${safeOwner}\\n${safeDate}`",
            "      : `🎟 <b>${ticket.pool} ETB · #${formatNumber(ticket.number)}</b>\\n🏆 <b>Prize:</b> ${safePrize}\\n👤 ${safeOwner}\\n${safeDate}`;",
            "    await bot.sendPhoto(chatId, png, `${ticket.id}.png`, caption, { parse_mode: 'HTML' });",
          ]
          ticket_replacement = "\n".join(ticket_lines)
          text, count = ticket_pattern.subn(lambda m: ticket_replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Ticket caption replacement count was {count}, expected 1')

          text = text.replace("'🏦 ክፍያዎን የሚልኩበትን አካውንት ይምረጡ።'", "'🏦 የክፍያ አካውንት ይምረጡ።'", 1)
          text = text.replace("'🏦 Choose the transfer account you want to pay.'", "'🏦 Choose a payment account.'", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check bot/backend/src/index.js

      - name: Install and test backend
        working-directory: bot/backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Verify buyer UX patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F "በእንጨት የተደጎሰ መጽሐፍ ቅዱስ" bot/backend/src/index.js
          grep -F "copy_text: { text: String(accountNumber) }" bot/backend/src/index.js
          grep -F "parse_mode: 'HTML'" bot/backend/src/index.js

      - name: Build DISCloud ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package
          cp bot/backend/discloud.config dist/package/
          cp bot/backend/package.json dist/package/
          cp -R bot/backend/src dist/package/src
          cd dist/package
          zip -r ../FinoteBirhan-DISCloud-Buyer-Simple.zip discloud.config package.json src >/dev/null
          cd ../..
          unzip -l dist/FinoteBirhan-DISCloud-Buyer-Simple.zip
          if unzip -l dist/FinoteBirhan-DISCloud-Buyer-Simple.zip | grep -Eq 'data/|\.sqlite|\.env'; then
            echo 'Unsafe data/env file found in package' >&2
            exit 1
          fi

      - name: Commit buyer UX changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/backend/src/index.js
          git rm .github/workflows/simplify-buyer-bot.yml
          git commit -m "fix: simplify buyer bot payment and ticket messages"
          git push origin HEAD:main

      - name: Upload DISCloud package
        uses: actions/upload-artifact@v4
        with:
          name: FinoteBirhan-DISCloud-Buyer-Simple
          path: dist/FinoteBirhan-DISCloud-Buyer-Simple.zip
          retention-days: 1
