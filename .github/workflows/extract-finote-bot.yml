name: Diagnose Finote Ticket Bot Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-finote-bot.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print first archive segment
        run: |
          head -c 500 bot/archive-parts/part00.b64
          echo
