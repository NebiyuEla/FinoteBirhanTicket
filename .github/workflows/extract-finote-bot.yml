name: Diagnose Finote Ticket Bot Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-finote-bot.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash 500-byte segments
        run: |
          mkdir -p /tmp/segments
          split -b 500 -d -a 2 bot/archive-parts/part00.b64 /tmp/segments/seg
          for f in /tmp/segments/seg*; do echo "$(basename "$f") $(wc -c < "$f") $(sha256sum "$f" | cut -d' ' -f1)"; done
