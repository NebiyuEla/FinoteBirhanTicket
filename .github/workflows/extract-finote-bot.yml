name: Build Finote Ticket Bot Backend Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-finote-bot.yml'

permissions:
  contents: write

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair staged archive byte
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot/archive-parts/part00.b64')
          s = p.read_text()
          old = 'wNttsbg'
          new = 'wNntsbg'
          if old not in s:
              raise SystemExit('expected archive repair marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Rebuild and verify backend archive
        run: |
          cat bot/archive-parts/part*.b64 | tr -d '\n' | base64 -d > /tmp/finote-bot.zip
          echo '1efaf1df5596068709b552803db91e9086d384ebff1b5e01aa964b9bd03bfc96  /tmp/finote-bot.zip' | sha256sum -c -
          unzip -t /tmp/finote-bot.zip

      - name: Extract backend source
        run: |
          rm -rf bot/backend
          mkdir -p bot/backend
          unzip -q /tmp/finote-bot.zip -d bot/backend

      - name: Test backend
        working-directory: bot/backend
        run: npm test

      - name: Commit verified backend source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/archive-parts/part00.b64 bot/backend
          git commit -m "feat: add multi-transfer-account bot backend source"
          git push
