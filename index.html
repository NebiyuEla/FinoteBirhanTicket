<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e7" />
  <meta name="description" content="FinoteBirhan digital ticket Telegram Mini App" />
  <title>ፍኖተ ብርሃን ዕጣ</title>
  <link rel="icon" href="./logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./assets/font-fix.css?v=20260924-1205" />
  <style>
    .number-screen.visible{min-height:0!important}
    .selection-shell{display:flex!important;flex-direction:column!important;min-height:0!important;overflow:hidden!important}
    .pool-tabs,.legend{flex:0 0 auto!important}
    .number-box{flex:1 1 0!important;min-height:0!important;height:auto!important;overflow:hidden!important}
    .number-grid{height:100%!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}
    .bottom-action-area{flex:0 0 auto!important;position:relative!important;z-index:20!important;background:rgba(255,253,248,.98)!important;padding-top:2px!important;padding-bottom:max(2px,env(safe-area-inset-bottom))!important}
    .primary-btn{visibility:visible!important;display:block!important}
    .contain-media img{object-fit:contain!important;object-position:center!important;background:#f7f1e7!important}
    #ticket200Image{object-fit:contain!important;object-position:center!important;padding:8px!important;background:#f7f1e7!important}
    @media(max-width:390px){.bottom-action-area{grid-template-columns:1fr!important}.selection-summary{min-height:42px!important}.primary-btn{min-height:58px!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app" id="app">
    <header class="brand-card" id="brandCard">
      <img src="./logo.svg" alt="ፍኖተ ብርሃን ዕጣ" class="brand-logo" />
      <div class="brand-copy">
        <span class="brand-kicker" data-i18n="brandKicker">ፍኖተ ብርሃን ሰ/ት/ቤት</span>
        <h1 data-i18n="brandTitle">ዕጣ ትኬት</h1>
        <p id="sellerLine">ትኬት ይምረጡ</p>
      </div>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Change language">EN</button>
    </header>

    <section class="screen" data-screen="sellerCustomer">
      <div class="section-head roomy">
        <div><h2 data-i18n="newSale">አዲስ ትኬት ሽያጭ</h2><p data-i18n="buyerInfo">የገዢውን መረጃ ያስገቡ</p></div>
      </div>
      <div class="seller-form">
        <label class="seller-field"><span data-i18n="buyerFullName">የገዢው ሙሉ ስም</span><input id="sellerBuyerName" autocomplete="name" maxlength="80" placeholder="ሙሉ ስም" /></label>
        <label class="seller-field"><span data-i18n="phone">ስልክ ቁጥር</span><input id="sellerBuyerPhone" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="09XXXXXXXX / 07XXXXXXXX" /></label>
        <div class="payment-section"><div class="pay-title" data-i18n="paymentDestination">ክፍያ የት ይገባ?</div><div class="pay-options"><button id="payFinote" class="pay-option active" type="button" data-pay="finote" data-i18n="finoteBirhan">ፍኖተ ብርሃን</button><button id="paySeller" class="pay-option" type="button" data-pay="seller" data-i18n="sellerAccount">የእኔ አካውንት</button></div></div>
        <div class="seller-note" id="sellerPaymentNote"></div>
        <button class="seller-next glow-action" id="sellerContinue" type="button" data-i18n="chooseTicketArrow">ትኬት ይምረጡ →</button>
      </div>
    </section>

    <section class="screen visible ticket-screen" data-screen="ticket">
      <div class="section-head roomy">
        <div><h2 data-i18n="chooseTicket">ትኬት ይምረጡ</h2><p data-i18n="chooseTicketHint">ሽልማቱን ይመልከቱ እና ትኬቱን ይጫኑ።</p></div>
      </div>
      <div class="seller-buyer-bar hidden" id="sellerBuyerBar"><div><strong id="sellerBuyerLabel">Buyer</strong><span id="sellerBuyerMeta"></span></div><button id="editBuyer" type="button" data-i18n="edit">ቀይር</button></div>

      <div class="ticket-scroll">
        <div class="ticket-grid" id="ticketGrid">
          <button class="ticket-card bundle clickable-glow" type="button" data-ticket="bundle">
            <div class="bundle-copy">
              <span class="badge" data-i18n="discount">ቅናሽ</span>
              <strong data-i18n="bundleTitle">ሶስቱም ዕጣዎች በአንድ</strong>
              <small data-i18n="bundlePrize">በ200፣ 100 እና 50 ብር ዕጣ አንድ አንድ ቁጥር — ዕድልዎን ይጨምራል</small>
            </div>
            <div class="bundle-price"><span class="old-price">350 <span data-i18n="birr">ብር</span></span><div class="ticket-price"><span>300</span><b data-i18n="birr">ብር</b></div></div>
          </button>

          <button class="ticket-card prize-card clickable-glow" type="button" data-ticket="200">
            <div class="prize-media contain-media"><img id="ticket200Image" src="./assets/ticket-200.webp?v=fix-20260924-1205" alt="የቅድስት ማርያም ምስለ ሰዕል" /></div>
            <div class="prize-copy"><span class="price-label">200 <span data-i18n="birr">ብር</span></span><strong class="prize-name" id="prize200">የቅድስት ማርያም ምስለ ሰዕል</strong><span class="tap-label" data-i18n="tapToChoose">ቁጥር ለመምረጥ ይጫኑ</span></div>
          </button>

          <button class="ticket-card prize-card clickable-glow" type="button" data-ticket="100">
            <div class="prize-media"><img id="ticket100Image" src="./logo.svg" alt="100 ብር ዕጣ" /></div>
            <div class="prize-copy"><span class="price-label">100 <span data-i18n="birr">ብር</span></span><strong class="prize-name" id="prize100">በእንጨት የተደጎሰ መጽሐፍ ቅዱስ</strong><span class="tap-label" data-i18n="tapToChoose">ቁጥር ለመምረጥ ይጫኑ</span></div>
          </button>

          <button class="ticket-card prize-card clickable-glow" type="button" data-ticket="50">
            <div class="prize-media"><img id="ticket50Image" src="./logo.svg" alt="50 ብር ዕጣ" /></div>
            <div class="prize-copy"><span class="price-label">50 <span data-i18n="birr">ብር</span></span><strong class="prize-name long-prize" id="prize50">ነጠላ፣ በኢፖክሲ የተሰራ 4:3 የቅድስት ማርያም ምስለ ሰዕል እና የዝማሬ ኄራን ቁልፍ መያዣ</strong><span class="tap-label" data-i18n="tapToChoose">ቁጥር ለመምረጥ ይጫኑ</span></div>
          </button>
        </div>
      </div>
    </section>

    <section class="screen number-screen" data-screen="numbers">
      <div class="number-head">
        <div><h2 data-i18n="chooseNumber">ቁጥር ይምረጡ</h2><p id="numberHelp">ከ001–200 አንድ ያልተወሰደ ቁጥር ይምረጡ።</p></div>
        <div class="number-actions"><button class="mini-lang" data-lang-control type="button">EN</button><button class="back-btn" id="backBtn" type="button" data-i18n="back">ተመለስ</button></div>
      </div>
      <div class="selection-shell">
        <div class="pool-tabs hidden" id="tabs"><button type="button" class="pool-tab active" data-pool="200">200 <span data-i18n="birr">ብር</span><b id="v200">—</b></button><button type="button" class="pool-tab" data-pool="100">100 <span data-i18n="birr">ብር</span><b id="v100">—</b></button><button type="button" class="pool-tab" data-pool="50">50 <span data-i18n="birr">ብር</span><b id="v50">—</b></button></div>
        <div class="legend"><span><i class="dot available"></i><span data-i18n="available">ያለ</span></span><span><i class="dot selected"></i><span data-i18n="selected">የተመረጠ</span></span><span><i class="dot taken"></i><span data-i18n="taken">የተወሰደ</span></span></div>
        <div class="number-box"><div class="number-grid" id="numberGrid" aria-label="Ticket numbers"></div></div>
        <div class="bottom-action-area"><div class="selection-summary" id="summary">ለመቀጠል ቁጥር ይምረጡ።</div><button class="primary-btn glow-action" id="confirmBtn" type="button" disabled data-i18n="reserveContinue">ይያዙ እና ይክፈሉ</button></div>
      </div>
    </section>

    <section class="screen" data-screen="error"><div class="state-card"><img src="./logo.svg" alt="" /><h2 data-i18n="expiredTitle">ሊንኩ አልፎታል</h2><p data-i18n="expiredText">ወደ ቦቱ ይመለሱ እና “ትኬት ይግዙ” በመጫን እንደገና ይክፈቱ።</p></div></section>
  </main>
  <script src="./app.js"></script>
  <script>
    (function () {
      function applyCopyFixes() {
        var lang = (localStorage.getItem('finote_lang') || document.documentElement.lang || 'am').toLowerCase().startsWith('en') ? 'en' : 'am';
        var p200 = document.getElementById('prize200');
        var p100 = document.getElementById('prize100');
        var p50 = document.getElementById('prize50');
        var confirm = document.getElementById('confirmBtn');
        if (p200) p200.textContent = lang === 'en' ? 'St Mary Icon' : 'የቅድስት ማርያም ምስለ ሰዕል';
        if (p100) p100.textContent = lang === 'en' ? 'Handcrafted Wooden Bible' : 'በእንጨት የተደጎሰ መጽሐፍ ቅዱስ';
        if (p50) p50.textContent = lang === 'en' ? 'Netela, 4:3 epoxy St Mary icon & Zemare Heran key holder' : 'ነጠላ፣ በኢፖክሲ የተሰራ 4:3 የቅድስት ማርያም ምስለ ሰዕል እና የዝማሬ ኄራን ቁልፍ መያዣ';
        if (confirm && confirm.textContent !== 'በመላክ ላይ…' && confirm.textContent !== 'Sending…') confirm.textContent = lang === 'en' ? 'Reserve & Pay' : 'ይያዙ እና ይክፈሉ';
      }
      applyCopyFixes();
      document.addEventListener('click', function (event) {
        if (event.target.closest('[data-lang-control],#langToggle,[data-number],[data-ticket]')) setTimeout(applyCopyFixes, 0);
      });
    })();
  </script>
</body>
</html>
