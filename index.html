<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e7" />
  <meta name="description" content="FinoteBirhan digital ticket Telegram Mini App" />
  <title>ፍኖተ ብርሃን ዕጣ</title>
  <link rel="icon" href="./logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html,body{height:100%;min-height:100%;max-height:100%;overflow:hidden!important;overscroll-behavior:none!important}
    body{position:fixed!important;inset:0!important;width:100%!important;touch-action:none!important}
    .app{height:var(--app-height,100dvh)!important;max-height:var(--app-height,100dvh)!important;overflow:hidden!important;padding:6px 8px max(8px,env(safe-area-inset-bottom))!important}
    .brand-card{height:60px!important;flex-basis:60px!important;margin-bottom:6px!important;padding:6px 9px!important}
    .brand-logo{width:46px!important;height:46px!important}.brand-copy h1{font-size:25px!important}.brand-kicker{font-size:10px!important}.brand-copy p{font-size:12px!important}
    .section-head{margin:2px 2px 6px!important}.section-head h2,.number-head h2{font-size:24px!important}.section-head p,.number-head p{font-size:12px!important;margin-top:2px!important}
    .ticket-grid{gap:7px!important;overflow:hidden!important}.ticket-card.bundle{height:58px!important;min-height:58px!important;flex-basis:58px!important;padding:7px 10px!important;border-radius:16px!important}.badge{font-size:8px!important;padding:2px 6px!important;margin-bottom:2px!important}.bundle-copy strong{font-size:17px!important}.bundle-copy small{font-size:8px!important;margin-top:1px!important}.old-price{font-size:9px!important}.ticket-price span{font-size:27px!important}
    .standard-row{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;align-items:start!important;justify-items:stretch!important;overflow:hidden!important}.ticket-card.standard{width:100%!important;aspect-ratio:1/1!important;border-radius:16px!important}.card-media{height:62%!important}.standard-copy{height:38%!important;padding:5px 6px!important}.standard-copy strong{font-size:15px!important}.standard-copy span{font-size:9px!important;margin-top:2px!important}
    .number-mode .brand-card{display:none!important}.number-mode .app{padding-top:5px!important}.screen[data-screen="numbers"].visible{display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;overflow:hidden!important;height:100%!important}.number-head{margin-bottom:4px!important;min-height:45px!important}.back-btn{padding:6px 9px!important;font-size:12px!important}.selection-shell{display:grid!important;grid-template-rows:auto auto minmax(0,1fr) auto 50px!important;gap:5px!important;padding:6px!important;overflow:hidden!important;min-height:0!important}.pool-tab{min-height:42px!important;font-size:12px!important}.pool-tab b{font-size:10px!important}.legend{font-size:9px!important;gap:6px!important}.number-box{min-height:0!important;height:auto!important;overflow:hidden!important;padding:4px!important}.number-grid{height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:4px!important;touch-action:pan-y!important;overscroll-behavior:contain!important;padding-bottom:2px!important}.num{font-size:10px!important;border-radius:9px!important}.selection-summary{min-height:32px!important;padding:6px 8px!important;font-size:12px!important;line-height:1.1!important}.primary-btn{height:50px!important;min-height:50px!important;flex-basis:50px!important;font-size:18px!important;border-radius:15px!important}
    @media(max-height:620px){.brand-card{height:54px!important;flex-basis:54px!important}.brand-logo{width:42px!important;height:42px!important}.section-head p{display:none!important}.ticket-card.bundle{height:52px!important;min-height:52px!important;flex-basis:52px!important}.bundle-copy small{display:none!important}.number-head p{font-size:10px!important}.pool-tab{min-height:38px!important}.primary-btn{height:46px!important;min-height:46px!important}.selection-shell{grid-template-rows:auto auto minmax(0,1fr) auto 46px!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app" id="app">
    <header class="brand-card" id="brandCard">
      <img src="./logo.svg" alt="ፍኖተ ብርሃን ዕጣ" class="brand-logo" />
      <div class="brand-copy">
        <span class="brand-kicker">ፍኖተ ብርሃን ሰ/ት/ቤት</span>
        <h1>ዕጣ ትኬት</h1>
        <p id="sellerLine">ትኬት ይምረጡ</p>
      </div>
    </header>

    <section class="screen visible" data-screen="ticket">
      <div class="section-head compact">
        <div><h2>ትኬት ይምረጡ</h2><p>ዋጋውን ይምረጡ፣ ከዚያ ቁጥር ያስይዙ።</p></div>
      </div>
      <div class="ticket-grid" id="ticketGrid">
        <button class="ticket-card bundle" type="button" data-ticket="bundle">
          <div class="bundle-copy"><span class="badge">ቅናሽ</span><strong>የሶስቱም ፓኬጅ</strong><small>200 + 100 + 50 ብር ዕጣ</small></div>
          <div class="bundle-price"><span class="old-price">350 ETB</span><div class="ticket-price"><span>300</span><b>ETB</b></div></div>
        </button>
        <div class="standard-row">
          <button class="ticket-card standard" type="button" data-ticket="200"><div class="card-media brand-media"><img src="./logo.svg" alt="" /></div><div class="standard-copy"><strong>200 ብር</strong><span>200 ETB</span></div></button>
          <button class="ticket-card standard product-card" type="button" data-ticket="100">
            <div class="card-media mini-carousel" id="ticket100Carousel" aria-label="100 ETB ticket item images">
              <img class="mini-slide active" src="./assets/ticket-200-1.webp" alt="100 ETB ticket item" />
              <img class="mini-slide" src="./assets/ticket-200-2.webp" alt="100 ETB ticket item" />
              <img class="mini-slide" src="./assets/ticket-200-3.webp" alt="100 ETB ticket item" />
              <span class="image-badge">100</span>
            </div>
            <div class="standard-copy"><strong>100 ብር</strong><span>100 ETB</span></div>
          </button>
          <button class="ticket-card standard" type="button" data-ticket="50"><div class="card-media brand-media gold-media"><img src="./logo.svg" alt="" /></div><div class="standard-copy"><strong>50 ብር</strong><span>50 ETB</span></div></button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="numbers">
      <div class="number-head"><div><h2>ቁጥር ይምረጡ</h2><p id="numberHelp">ከ001–200 ያልተወሰደ ቁጥር ይምረጡ።</p></div><button class="back-btn" id="backBtn" type="button">ተመለስ</button></div>
      <div class="selection-shell">
        <div class="pool-tabs hidden" id="tabs">
          <button type="button" class="pool-tab active" data-pool="200">200 ብር <b id="v200">—</b></button>
          <button type="button" class="pool-tab" data-pool="100">100 ብር <b id="v100">—</b></button>
          <button type="button" class="pool-tab" data-pool="50">50 ብር <b id="v50">—</b></button>
        </div>
        <div class="legend"><span><i class="dot available"></i>ያለ</span><span><i class="dot selected"></i>የተመረጠ</span><span><i class="dot taken"></i>የተወሰደ</span></div>
        <div class="number-box"><div class="number-grid" id="numberGrid" aria-label="Ticket numbers"></div></div>
        <div class="selection-summary" id="summary">ለመቀጠል ቁጥር ይምረጡ።</div>
        <button class="primary-btn" id="confirmBtn" type="button" disabled>ያስይዙ እና ይቀጥሉ</button>
      </div>
    </section>

    <section class="screen" data-screen="error"><div class="state-card"><img src="./logo.svg" alt="" /><h2>ሊንኩ አልፎታል</h2><p>ወደ ቦቱ ይመለሱ እና Buy Ticket በመጫን እንደገና ይክፈቱ።</p></div></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
